# Nginx: sirve el frontend (React) y hace de proxy hacia el backend (Express).
# Dominio principal: gestionetodoypidaya.tech (www redirige al principal).

server_tokens off;

# DNS interno de Docker: resuelve "backend" en cada peticion, asi un contenedor
# recreado (con IP nueva) no deja a Nginx apuntando a una IP vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

# Limite de intentos para login/registro (por IP): 10 por minuto, rafaga de 5.
limit_req_zone $binary_remote_addr zone=autenticacion:10m rate=10r/m;
limit_req_status 429;

# HTTP: solo el reto de Let's Encrypt; todo lo demas va a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gestionetodoypidaya.tech www.gestionetodoypidaya.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gestionetodoypidaya.tech$request_uri;
    }
}

# HTTPS www -> dominio principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gestionetodoypidaya.tech;

    ssl_certificate     /etc/letsencrypt/live/gestionetodoypidaya.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestionetodoypidaya.tech/privkey.pem;

    return 301 https://gestionetodoypidaya.tech$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name gestionetodoypidaya.tech;

    ssl_certificate     /etc/letsencrypt/live/gestionetodoypidaya.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestionetodoypidaya.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Las imagenes de platos pueden pesar hasta 5 MB (limite de multer)
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    set $backend http://backend:5000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/auth/(login|registro)$ {
        limit_req zone=autenticacion burst=5 nodelay;
        proxy_pass $backend;
    }

    location /api/ {
        proxy_pass $backend;
    }

    # Imagenes subidas: se leen directo del volumen compartido con el backend
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
    }

    # Archivos de Vite con hash en el nombre: cache larga
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Rutas de React Router: cualquier ruta desconocida carga la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente oficial de la aplicación (Rojo coral a Naranja cálido) -->
    <linearGradient id="gradienteApp" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#EA4D46" />
      <stop offset="50%" stop-color="#EF6E4E" />
      <stop offset="100%" stop-color="#F79F3D" />
    </linearGradient>
  </defs>

  <!-- Fondo squircle redondeado -->
  <rect width="512" height="512" rx="115" fill="url(#gradienteApp)" />

  <!-- Ícono del gorro de chef -->
  <g 
    transform="translate(82, 78.4) scale(14.5)" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <!-- Silueta del gorro -->
    <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
    <!-- Línea divisoria de la base -->
    <line x1="6" y1="17" x2="18" y2="17" />
  </g>
</svg>